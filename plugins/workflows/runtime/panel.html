<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflows</title><style>:root{color-scheme:light dark}body{margin:0}</style></head><body><!-- The host bridge renders persisted workflow data; standalone preview stays offline. -->
<div id="workflow-panel-prototype" class="viz-dotted-background">
  <section class="wf-window" aria-label="Workflows 任务面板">
    <header class="wf-header">
      <div class="wf-brand"><span class="wf-title">Workflows</span><span id="wf-connection" class="wf-prototype-label" role="status">离线预览 · 连接宿主后可查看真实运行记录</span></div>
      <div id="wf-project" class="wf-project">项目尚未选择</div>
    </header>
    <div class="wf-run-picker">
      <label for="wf-run-select">运行记录</label>
      <select id="wf-run-select" aria-label="查看运行记录" disabled><option>暂无运行记录</option></select><button id="wf-refresh" type="button" disabled>刷新</button><button id="wf-new" type="button" disabled>新建</button>
    </div>
    <div class="wf-run-picker">
      <label for="wf-template-select">工作流库</label>
      <select id="wf-template-select" aria-label="选择工作流定义" disabled><option value="">暂无工作流定义</option></select>
      <button id="wf-load-template" type="button" disabled>载入到新运行</button>
    </div>
    <div id="wf-notification" class="wf-alert" role="alert" hidden></div>
    <details id="wf-editor" class="wf-editor">
      <summary>新建或编辑工作流</summary>
      <form id="wf-form">
        <label for="wf-project-path">项目目录（绝对路径）</label>
        <input id="wf-project-path" name="projectPath" type="text" required autocomplete="off" spellcheck="false" placeholder="从宿主读取不到项目时，请填写目录" disabled>
        <label for="wf-script">动态脚本</label>
        <textarea id="wf-script" name="script" rows="12" required spellcheck="false" placeholder="粘贴包含 export const meta 的工作流脚本" disabled></textarea>
        <label for="wf-args">输入参数（JSON）</label>
        <textarea id="wf-args" name="args" rows="3" required spellcheck="false" disabled>{}</textarea>
        <label class="wf-checkbox"><input id="wf-allow-write" name="allowWrite" type="checkbox" disabled>允许在隔离工作区修改代码和运行测试</label>
        <p class="wf-muted">预览只校验并保存脚本；点击“开始”后才调度 worker。</p>
        <div id="wf-template-help" class="wf-muted"></div>
        <div class="wf-actions"><button id="wf-save" class="wf-primary" type="submit" disabled>保存预览</button><button id="wf-save-definition" type="button" disabled>保存到工作流库</button><button id="wf-editor-cancel" type="button">收起</button></div>
        <div id="wf-editor-error" class="wf-alert" role="alert" hidden></div>
        <div id="wf-editor-status" class="wf-notice" role="status" hidden></div>
      </form>
    </details>
    <div class="wf-run-header">
      <div><h2 id="wf-run-title">暂无运行记录</h2><div id="wf-run-meta" class="wf-muted"></div></div>
      <div id="wf-actions" class="wf-actions"></div>
    </div>
    <div class="wf-status-row" aria-live="polite">
      <span id="wf-execution-status" class="wf-badge"></span>
      <span id="wf-change-status" class="wf-badge"></span>
      <span id="wf-progress" class="wf-progress-text"></span>
    </div>
    <nav class="wf-tabs" role="tablist" aria-label="工作流详情">
      <button type="button" id="wf-tab-overview" class="cursor-interaction" role="tab" aria-controls="wf-panel-overview" aria-selected="true" data-tab="overview">概览</button>
      <button type="button" id="wf-tab-tasks" class="cursor-interaction" role="tab" aria-controls="wf-panel-tasks" aria-selected="false" data-tab="tasks">任务 <span id="wf-task-count">0</span></button>
      <button type="button" id="wf-tab-diff" class="cursor-interaction" role="tab" aria-controls="wf-panel-diff" aria-selected="false" data-tab="diff">差异</button>
      <button type="button" id="wf-tab-logs" class="cursor-interaction" role="tab" aria-controls="wf-panel-logs" aria-selected="false" data-tab="logs">日志</button>
    </nav>
    <div class="wf-content">
      <section id="wf-panel-overview" role="tabpanel" aria-labelledby="wf-tab-overview"><div class="wf-empty">当前为离线预览。请从 Workflows 插件打开面板；这里不会模拟执行任务。</div></section>
      <section id="wf-panel-tasks" role="tabpanel" aria-labelledby="wf-tab-tasks" hidden></section>
      <section id="wf-panel-diff" role="tabpanel" aria-labelledby="wf-tab-diff" hidden></section>
      <section id="wf-panel-logs" role="tabpanel" aria-labelledby="wf-tab-logs" hidden></section>
    </div>
    <footer class="wf-footer"><span>只读任务可并行 · 写入任务上限 1</span><span>开始与应用均由你点击确认</span></footer>
  </section>
</div>
<style>

#workflow-panel-prototype .wf-run-header{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

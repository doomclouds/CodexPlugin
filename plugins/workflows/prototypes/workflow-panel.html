<!-- Native host styles and persisted runtime activity drive this panel. -->
<div id="workflow-panel-prototype">
  <section class="wf-window" aria-label="Workflows 任务面板">
    <header class="wf-header">
      <div class="wf-brand"><h1 class="wf-title">Workflows</h1><div class="wf-project-picker"><span class="wf-icon" data-icon="folder" aria-hidden="true"></span><select id="wf-project-select" aria-label="目标项目" aria-describedby="wf-project-help" disabled><option value="">选择项目</option></select></div><button id="wf-refresh-projects" class="wf-icon-button" type="button" aria-label="刷新项目" title="刷新项目" disabled><span class="wf-icon" data-icon="refresh" aria-hidden="true"></span></button><span id="wf-connection" class="wf-muted" role="status">离线预览</span><button id="wf-reconnect" type="button">重新连接</button></div>
      <p id="wf-project-help" class="wf-muted" role="status"></p>
    </header>
    <div class="wf-toolbar">
      <select id="wf-template-select" aria-label="选择工作流" disabled><option value="">选择工作流</option></select>
      <div class="wf-toolbar-options">
        <button id="wf-parameters-toggle" type="button" disabled><span class="wf-icon" data-icon="adjustments-horizontal" aria-hidden="true"></span>参数</button>
        <button id="wf-settings-toggle" type="button" disabled><span class="wf-icon" data-icon="settings" aria-hidden="true"></span>设置</button>
        <button id="wf-history-toggle" class="wf-icon-button" type="button" aria-label="运行历史" title="运行历史" disabled><span class="wf-icon" data-icon="history" aria-hidden="true"></span></button>
        <div class="wf-more-wrap"><button id="wf-more-toggle" class="wf-icon-button" type="button" aria-label="更多工作流操作" aria-expanded="false" aria-controls="wf-more-menu" title="更多操作" disabled><span class="wf-icon" data-icon="dots" aria-hidden="true"></span></button><div id="wf-more-menu" class="wf-menu" role="menu" hidden><button id="wf-review-toggle" type="button" role="menuitem"><span class="wf-icon" data-icon="file-text" aria-hidden="true"></span>查看改动与结果</button><button id="wf-save-definition" type="button" role="menuitem"><span class="wf-icon" data-icon="folder" aria-hidden="true"></span>保存到工作流库</button><button id="wf-delete-toggle" class="wf-danger" type="button" role="menuitem"><span class="wf-icon" data-icon="trash" aria-hidden="true"></span>删除工作流…</button><button id="wf-refresh" type="button" role="menuitem"><span class="wf-icon" data-icon="refresh" aria-hidden="true"></span>刷新记录</button></div></div>
      </div>
      <div class="wf-execution-controls"><span id="wf-execution-status" class="wf-execution-state" role="status">待选择</span><div id="wf-actions" class="wf-actions"><button type="button" data-action="start" disabled>启动</button><button type="button" data-action="stop" disabled>停止</button></div></div>
    </div>
    <div id="wf-notification" class="wf-alert" role="alert" hidden></div>
    <section class="wf-activity-summary" aria-label="当前工作流进度"><h2 id="wf-current-action">选择工作流，查看执行过程</h2><p id="wf-activity-time" class="wf-muted"></p><ol id="wf-preparation" class="wf-preparation" aria-label="启动准备阶段"></ol></section>
    <section class="wf-canvas" aria-label="工作流执行图"><div id="wf-graph-viewport" class="wf-graph-viewport"><section id="wf-panel-overview" aria-label="工作流执行流程"></section></div><div class="wf-zoom-controls" role="group" aria-label="流程图缩放"><button id="wf-zoom-fit" type="button" data-zoom="fit" aria-label="适应窗口" disabled><span class="wf-icon" data-icon="arrows-maximize" aria-hidden="true"></span></button><button id="wf-zoom-out" type="button" data-zoom="out" aria-label="缩小流程图" disabled><span class="wf-icon" data-icon="minus" aria-hidden="true"></span></button><button id="wf-zoom-reset" type="button" data-zoom="reset" aria-label="重置流程图缩放" disabled><span id="wf-zoom-value">100%</span></button><button id="wf-zoom-in" type="button" data-zoom="in" aria-label="放大流程图" disabled><span class="wf-icon" data-icon="plus" aria-hidden="true"></span></button></div></section>
    <footer class="wf-footer"><span class="wf-icon" data-icon="alert-circle" aria-hidden="true"></span><span>点击节点查看简要过程、结果与错误</span></footer>
    <dialog id="wf-parameters-dialog" class="wf-dialog" aria-labelledby="wf-parameters-title"><div class="wf-dialog-header"><h2 id="wf-parameters-title">工作流参数</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭参数"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><p id="wf-parameter-status" class="wf-muted"></p><form id="wf-parameters-form"><div id="wf-parameter-fields" class="wf-parameter-fields"></div><div id="wf-parameter-error" class="wf-alert" role="alert" hidden></div><div class="wf-dialog-actions"><button type="button" data-close-dialog>取消</button><button id="wf-save-parameters" class="wf-primary" type="submit">保存参数</button></div></form></dialog>
    <dialog id="wf-settings-dialog" class="wf-dialog" aria-labelledby="wf-settings-title"><div class="wf-dialog-header"><h2 id="wf-settings-title">执行设置</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭设置"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><p class="wf-muted">默认设置用于新运行；正在执行的运行保留启动时的配置。</p><div id="wf-execution-scope" class="wf-notice"></div><form id="wf-settings-form" class="wf-settings-form"><label for="wf-default-model">默认模型</label><select id="wf-default-model" disabled></select><label for="wf-default-effort">思考深度</label><select id="wf-default-effort" disabled></select><div id="wf-settings-error" class="wf-alert" role="alert" hidden></div><p id="wf-settings-status" class="wf-muted"></p><div class="wf-dialog-actions"><button id="wf-refresh-settings" type="button">刷新设置</button><button type="button" data-close-dialog>取消</button><button id="wf-save-settings" class="wf-primary" type="submit" disabled>保存设置</button></div></form></dialog>
    <dialog id="wf-history-dialog" class="wf-dialog wf-dialog-wide" aria-labelledby="wf-history-title"><div class="wf-dialog-header"><h2 id="wf-history-title">运行历史</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭运行历史"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><p id="wf-history-context" class="wf-muted"></p><div id="wf-history-list"></div></dialog>
    <dialog id="wf-process-dialog" class="wf-dialog wf-dialog-wide" aria-labelledby="wf-process-title"><div class="wf-dialog-header"><h2 id="wf-process-title">节点过程</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭节点过程"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><div id="wf-process-body"></div><details id="wf-developer-logs"><summary>开发日志</summary><p class="wf-muted">技术日志可能包含命令、项目内容与执行器输出。</p><pre id="wf-process-developer"></pre></details><div class="wf-dialog-actions"><button id="wf-process-node-settings" type="button" hidden>节点设置</button><button id="wf-retry-task" type="button" title="保留前面结果，重新执行此节点及后续节点" hidden disabled>从此节点重试</button><button id="wf-cancel-task" type="button" class="wf-danger" hidden disabled>中断此任务</button><button type="button" data-close-dialog>关闭</button></div></dialog>
    <dialog id="wf-review-dialog" class="wf-dialog wf-dialog-wide" aria-labelledby="wf-review-title"><div class="wf-dialog-header"><h2 id="wf-review-title">改动与结果</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭改动与结果"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><div id="wf-review-body"></div><div class="wf-dialog-actions"><button type="button" data-close-dialog>关闭</button><button id="wf-apply-changes" class="wf-primary" type="button" disabled>应用改动</button></div></dialog>
    <dialog id="wf-node-settings-dialog" class="wf-dialog" aria-labelledby="wf-node-settings-title" aria-describedby="wf-node-settings-target"><div class="wf-dialog-header"><h2 id="wf-node-settings-title">节点设置</h2><button id="wf-close-node-settings" class="wf-icon-button" type="button" aria-label="关闭节点设置"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><p id="wf-node-settings-target" class="wf-muted"></p><form id="wf-node-settings-form" class="wf-settings-form"><label for="wf-node-model">模型</label><select id="wf-node-model" disabled></select><label for="wf-node-effort">思考深度</label><select id="wf-node-effort" disabled></select><p id="wf-node-settings-status" class="wf-muted"></p><div class="wf-dialog-actions"><button id="wf-refresh-node-settings" type="button" hidden>刷新模型</button><button id="wf-cancel-node-settings" type="button">取消</button><button id="wf-save-node-settings" class="wf-primary" type="submit" disabled>保存节点设置</button></div></form></dialog>
    <dialog id="wf-delete-dialog" class="wf-dialog" aria-labelledby="wf-delete-title"><div class="wf-dialog-header"><h2 id="wf-delete-title">彻底删除</h2><button class="wf-icon-button" type="button" data-close-dialog aria-label="关闭删除"><span class="wf-icon" data-icon="x" aria-hidden="true"></span></button></div><fieldset class="wf-delete-scope"><legend>删除范围</legend><label><input type="radio" name="wf-delete-scope" value="run" checked>仅删除本次运行</label><label><input type="radio" name="wf-delete-scope" value="template">删除工作流定义及明确关联的运行</label></fieldset><details id="wf-delete-legacy" hidden><summary>额外选择此项目的旧运行</summary><p class="wf-muted">这些记录未与定义关联，默认保留。仅删除你在此明确勾选的运行，不根据名称判断归属。</p><div id="wf-delete-legacy-list" class="wf-delete-legacy-list"></div></details><div id="wf-delete-preview" aria-live="polite"></div><div id="wf-delete-error" class="wf-alert" role="alert" hidden></div><div class="wf-dialog-actions"><button type="button" data-close-dialog>取消</button><button id="wf-confirm-delete" class="wf-danger" type="button" disabled>彻底删除</button></div></dialog>
  </section>
</div>
<style>
body{background:var(--color-background-primary,light-dark(#ffffff,#181818))}
#workflow-panel-prototype{padding:12px;color-scheme:inherit;
--wf-bg:var(--color-background-primary,light-dark(#ffffff,#181818));
--wf-surface:var(--color-background-secondary,light-dark(#f5f5f5,#212121));
--wf-selected:var(--color-background-tertiary,light-dark(#ebebeb,#303030));
--wf-text:var(--color-text-primary,light-dark(#202020,#ececec));
--wf-muted:var(--color-text-secondary,light-dark(#686868,#a5a5a5));
--wf-border:var(--color-border-primary,light-dark(#dedede,#383838));
--wf-strong:var(--color-background-inverse,light-dark(#242424,#ececec));
--wf-on-strong:var(--color-text-inverse,light-dark(#ffffff,#181818));
--wf-blue:var(--color-text-info,light-dark(#275cc2,#a8c4ff));
--wf-blue-bg:var(--color-background-info,light-dark(#edf3ff,#26364f));
--wf-green:var(--color-text-success,light-dark(#216140,#a1d6b5));
--wf-green-bg:var(--color-background-success,light-dark(#ecf6ef,#243c2e));
--wf-amber:var(--color-text-warning,light-dark(#80541b,#efc482));
--wf-amber-bg:var(--color-background-warning,light-dark(#fff4df,#413421));
--wf-red:var(--color-text-danger,light-dark(#a23737,#ffb0b0));
--wf-red-bg:var(--color-background-danger,light-dark(#fdeeee,#47292b));
--wf-font:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif);
--wf-mono:var(--font-mono,ui-monospace,SFMono-Regular,Consolas,monospace);
--wf-xs:var(--font-text-xs-size,12px);--wf-sm:var(--font-text-sm-size,14px);--wf-md:var(--font-text-md-size,14px);
--wf-line-xs:var(--font-text-xs-line-height,1.6);--wf-line-sm:var(--font-text-sm-line-height,1.5);--wf-line-md:var(--font-text-md-line-height,1.5);
--wf-title:var(--font-heading-md-size,18px);--wf-heading:var(--font-heading-sm-size,16px);
--wf-title-line:var(--font-heading-md-line-height,1.4);--wf-heading-line:var(--font-heading-sm-line-height,1.5);
--wf-radius-xs:var(--border-radius-xs,4px);--wf-radius-sm:var(--border-radius-sm,6px);--wf-radius-md:var(--border-radius-md,8px);--wf-radius-lg:var(--border-radius-lg,12px);
--wf-weight:var(--font-weight-normal,400);--wf-medium:var(--font-weight-medium,500);--wf-border-width:var(--border-width-regular,1px);
font:var(--wf-weight) var(--wf-sm)/var(--wf-line-sm) var(--wf-font);color:var(--wf-text)}

html,body{height:100%;margin:0;overflow:hidden}
#workflow-panel-prototype{height:100dvh;overflow-y:auto;overflow-x:hidden;padding:24px;scrollbar-width:thin;overscroll-behavior-y:auto}
#workflow-panel-prototype *{box-sizing:border-box}
#workflow-panel-prototype [hidden]{display:none!important}
#workflow-panel-prototype button,#workflow-panel-prototype select,#workflow-panel-prototype input,#workflow-panel-prototype textarea{font:inherit;color:inherit;color-scheme:inherit}
#workflow-panel-prototype option,#workflow-panel-prototype optgroup{font:inherit;color:var(--wf-text);background:var(--wf-bg)}
#workflow-panel-prototype option:disabled,#workflow-panel-prototype optgroup:disabled{color:var(--wf-muted)}
#workflow-panel-prototype input::placeholder,#workflow-panel-prototype textarea::placeholder{color:var(--wf-muted);opacity:1}
#workflow-panel-prototype input[type=checkbox],#workflow-panel-prototype input[type=radio]{accent-color:var(--wf-blue)}
#workflow-panel-prototype select:disabled,#workflow-panel-prototype input:disabled,#workflow-panel-prototype textarea:disabled{color:var(--wf-muted);-webkit-text-fill-color:var(--wf-muted)}
#workflow-panel-prototype button{border:var(--wf-border-width) solid var(--wf-border);background:var(--wf-bg);border-radius:var(--wf-radius-md);padding:9px 13px;min-height:38px;cursor:pointer}
#workflow-panel-prototype button:hover:not(:disabled){background:var(--wf-surface)}
#workflow-panel-prototype button:disabled{opacity:.45;cursor:default}
#workflow-panel-prototype :focus-visible{outline:2px solid var(--wf-blue);outline-offset:3px}
#workflow-panel-prototype .wf-primary{background:var(--wf-strong);color:var(--wf-on-strong);border-color:transparent}
#workflow-panel-prototype .wf-primary:hover:not(:disabled){background:var(--wf-strong);opacity:.9}
#workflow-panel-prototype .wf-danger{color:var(--wf-red)}
#workflow-panel-prototype .wf-window{min-width:0}
#workflow-panel-prototype .wf-header{padding-bottom:20px}
#workflow-panel-prototype .wf-brand{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
#workflow-panel-prototype .wf-title{margin:0;font-size:var(--font-heading-lg-size,24px);line-height:1.4;font-weight:var(--wf-medium);letter-spacing:-.4px}
#workflow-panel-prototype .wf-muted{color:var(--wf-muted);font-size:var(--wf-xs);line-height:var(--wf-line-xs);overflow-wrap:anywhere}
#workflow-panel-prototype .wf-project-picker{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--wf-border);border-radius:var(--wf-radius-md);max-width:min(380px,60%)}
#workflow-panel-prototype .wf-project-picker select{border:0;background:transparent;padding:0;max-width:100%;min-width:0}
#workflow-panel-prototype #wf-connection{margin-left:auto}
#workflow-panel-prototype #wf-project-help{margin:8px 0 0;min-height:0}
#workflow-panel-prototype #wf-project-help:empty{display:none}
#workflow-panel-prototype .wf-toolbar{display:flex;align-items:center;gap:12px;min-width:0;padding-bottom:20px;border-bottom:1px solid var(--wf-border)}
#workflow-panel-prototype #wf-template-select{flex:1;min-width:120px;height:42px;padding:10px 12px}
#workflow-panel-prototype select,#workflow-panel-prototype input:not([type=checkbox]):not([type=radio]),#workflow-panel-prototype textarea{border:1px solid var(--wf-border);border-radius:var(--wf-radius-md);background:var(--wf-bg);padding:8px 10px;max-width:100%;min-width:0}
#workflow-panel-prototype .wf-toolbar-options,#workflow-panel-prototype .wf-execution-controls,#workflow-panel-prototype .wf-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
#workflow-panel-prototype .wf-toolbar-options>button,#workflow-panel-prototype .wf-actions button{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
#workflow-panel-prototype .wf-icon-button{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:8px}
#workflow-panel-prototype .wf-execution-controls{margin-left:auto;gap:16px}
#workflow-panel-prototype .wf-execution-state{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--wf-muted);font-size:var(--wf-xs)}
#workflow-panel-prototype [data-tone=blue]{color:var(--wf-blue)}
#workflow-panel-prototype [data-tone=green]{color:var(--wf-green)}
#workflow-panel-prototype [data-tone=amber]{color:var(--wf-amber)}
#workflow-panel-prototype [data-tone=red]{color:var(--wf-red)}
#workflow-panel-prototype .wf-activity-summary{padding:18px 0 16px}
#workflow-panel-prototype h2{font-size:var(--wf-heading);line-height:var(--wf-heading-line);font-weight:var(--wf-medium);margin:0 0 5px;overflow-wrap:anywhere}
#workflow-panel-prototype #wf-activity-time{margin:0;font-variant-numeric:tabular-nums}
#workflow-panel-prototype .wf-preparation{list-style:none;padding:0;margin:16px 0 0;display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--wf-muted);font-size:var(--wf-xs)}
#workflow-panel-prototype .wf-preparation:empty{display:none}
#workflow-panel-prototype .wf-preparation li{display:flex;align-items:center;gap:7px}
#workflow-panel-prototype .wf-preparation button{border:0;border-radius:0;background:transparent;padding:0;min-height:24px;color:inherit;font:inherit;text-align:left}
#workflow-panel-prototype .wf-preparation .wf-icon{width:17px;height:17px}
#workflow-panel-prototype .wf-alert{margin:12px 0;padding:10px 12px;color:var(--wf-red);background:var(--wf-red-bg);border-radius:var(--wf-radius-md);font-size:var(--wf-xs);overflow-wrap:anywhere}
#workflow-panel-prototype .wf-canvas{position:relative;border:1px solid var(--wf-border);border-radius:var(--wf-radius-md);overflow:hidden;background:var(--wf-bg);min-width:0;min-height:390px}
#workflow-panel-prototype .wf-canvas::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("../assets/workflow-canvas.png");background-size:320px 320px;opacity:.38}
#workflow-panel-prototype .wf-graph-viewport{position:relative;min-width:0;--wf-graph-zoom:1}
#workflow-panel-prototype .wf-graph-scroll{overflow-x:auto;overflow-y:visible;min-height:390px;max-width:100%;padding:32px 28px 72px;overscroll-behavior-x:auto;overscroll-behavior-y:auto;scrollbar-width:thin}
#workflow-panel-prototype .wf-graph-track{display:flex;align-items:center;min-height:290px;width:max-content;min-width:100%;justify-content:center;zoom:var(--wf-graph-zoom);padding:12px 0;gap:0}
#workflow-panel-prototype .wf-graph-phase{position:relative;flex:0 0 230px;width:230px;min-height:132px;border:1.5px solid var(--wf-border);border-radius:var(--wf-radius-lg);background:var(--wf-bg);padding:14px 15px;color:var(--wf-muted);align-self:center}
#workflow-panel-prototype .wf-graph-phase[data-status=completed]{border-color:var(--wf-green);background:var(--wf-green-bg)}
#workflow-panel-prototype .wf-graph-phase[data-status=running]{min-height:180px;border-color:var(--wf-blue);background:var(--wf-blue-bg)}
#workflow-panel-prototype .wf-graph-phase[data-status=failed]{border-color:var(--wf-red);background:var(--wf-red-bg)}
#workflow-panel-prototype .wf-graph-phase[data-status=stopping],#workflow-panel-prototype .wf-graph-phase[data-status=interrupted],#workflow-panel-prototype .wf-graph-phase[data-status=stopped]{border-color:var(--wf-amber)}
#workflow-panel-prototype .wf-graph-phase-heading{display:flex;gap:8px;align-items:center;min-width:0;border-bottom:1px solid var(--wf-border);padding-bottom:12px;margin-bottom:11px}
#workflow-panel-prototype .wf-graph-phase-title{flex:1;min-width:0;font-weight:var(--wf-medium);font-size:var(--wf-sm);color:var(--wf-text);overflow-wrap:anywhere}
#workflow-panel-prototype .wf-graph-phase-heading>.wf-icon{width:24px;height:24px}
#workflow-panel-prototype .wf-graph-phase[data-status=completed] .wf-graph-phase-heading>.wf-icon{color:var(--wf-green)}
#workflow-panel-prototype .wf-graph-phase[data-status=running] .wf-graph-phase-heading>.wf-icon{color:var(--wf-blue)}
#workflow-panel-prototype .wf-graph-phase[data-status=failed] .wf-graph-phase-heading>.wf-icon{color:var(--wf-red)}
#workflow-panel-prototype button.wf-node-settings-icon,#workflow-panel-prototype button.wf-node-process-icon{border:0;background:transparent;min-height:26px;height:26px;width:26px;padding:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--wf-muted)}
#workflow-panel-prototype .wf-node-settings-icon .wf-icon,#workflow-panel-prototype .wf-node-process-icon .wf-icon{width:17px;height:17px}
#workflow-panel-prototype .wf-graph-phase-state{display:flex;align-items:center;gap:6px;font-size:var(--wf-xs);font-variant-numeric:tabular-nums;margin-bottom:8px}
#workflow-panel-prototype .wf-graph-phase-activity{font-size:var(--wf-xs);margin:0 0 10px;overflow-wrap:anywhere;color:var(--wf-text)}
#workflow-panel-prototype .wf-graph-groups{display:grid;gap:8px}
#workflow-panel-prototype .wf-graph-nodes{display:grid;gap:6px}
#workflow-panel-prototype .wf-graph-group-label{font-size:var(--wf-xs);color:var(--wf-muted);margin:4px 0}
#workflow-panel-prototype button.wf-graph-node{display:flex;gap:7px;align-items:flex-start;text-align:left;border:0;border-radius:var(--wf-radius-xs);padding:5px 0;background:transparent;width:100%;min-height:25px;font-size:var(--wf-xs);color:var(--wf-muted)}
#workflow-panel-prototype button.wf-graph-node:hover:not(:disabled){color:var(--wf-text);background:var(--wf-surface)}
#workflow-panel-prototype .wf-graph-node-icon{width:16px;height:16px;margin-top:2px}
#workflow-panel-prototype .wf-graph-node-content{display:grid;gap:3px;flex:1;min-width:0}
#workflow-panel-prototype .wf-graph-node-title{overflow-wrap:anywhere}

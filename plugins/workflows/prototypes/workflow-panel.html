<!-- The host bridge renders persisted workflow data; standalone preview stays offline. -->
<div id="workflow-panel-prototype" class="viz-dotted-background">
  <section class="wf-window" aria-label="Workflows 任务面板">
    <header class="wf-header">
      <div class="wf-brand"><h1 class="wf-title">Workflows</h1><span id="wf-connection" class="wf-prototype-label" role="status">离线预览 · 连接宿主后可查看真实运行记录</span></div>
    </header>
    <div class="wf-toolbar">
      <div class="wf-workflow-picker">
        <label for="wf-template-select">工作流</label>
        <span id="wf-template-count" class="wf-library-count" role="status">未连接</span>
        <select id="wf-template-select" aria-label="选择工作流" disabled><option value="">选择工作流</option></select>
      </div>
      <div class="wf-execution-controls">
        <button id="wf-settings-toggle" class="wf-settings-toggle" type="button" disabled><span class="wf-icon" data-icon="settings" aria-hidden="true"></span>执行设置</button>
        <span id="wf-execution-status" class="wf-execution-state" role="status">待选择</span>
        <div id="wf-actions" class="wf-actions"><button type="button" data-action="start" disabled>启动</button><button type="button" data-action="stop" class="wf-stop" disabled>停止</button></div>
      </div>
    </div>
    <div class="wf-project-row"><span>项目：</span><span id="wf-project" class="wf-project">尚未选择</span></div>
    <div id="wf-notification" class="wf-alert" role="alert" hidden></div>
    <section id="wf-parameters" class="wf-parameters" aria-labelledby="wf-parameters-title">
      <h2 id="wf-parameters-title">工作流参数</h2>
      <div id="wf-parameter-fields" class="wf-parameter-fields"><p class="wf-muted">选择工作流后显示所需参数。</p></div>
      <div id="wf-parameter-error" class="wf-alert" role="alert" hidden></div>
      <div id="wf-parameter-status" class="wf-muted" role="status" aria-live="polite"></div>
    </section>
    <section class="wf-canvas" aria-labelledby="wf-flow-title">
      <div class="wf-canvas-heading"><h2 id="wf-flow-title">执行流程</h2></div>
      <div id="wf-graph-viewport" class="wf-graph-viewport">
        <section id="wf-panel-overview" role="tabpanel" aria-label="工作流执行流程"><div class="wf-empty">连接宿主后，选择工作流查看计划与真实节点状态。</div></section>
      </div>
      <div class="wf-canvas-footer">
        <ul class="wf-state-legend" aria-label="节点状态图例">
          <li data-status="completed"><span class="wf-state-mark" aria-hidden="true"></span>已完成</li>
          <li data-status="running"><span class="wf-state-mark" aria-hidden="true"></span>运行中</li>
          <li data-status="queued"><span class="wf-state-mark" aria-hidden="true"></span>等待中</li>
          <li data-status="failed"><span class="wf-state-mark" aria-hidden="true"></span>失败</li>
        </ul>
        <div class="wf-zoom-controls" role="group" aria-label="流程图缩放">
          <button id="wf-zoom-out" type="button" data-zoom="out" aria-label="缩小流程图" disabled>−</button>
          <button id="wf-zoom-reset" type="button" data-zoom="reset" aria-label="重置流程图缩放" disabled><span id="wf-zoom-value">100%</span></button>
          <button id="wf-zoom-in" type="button" data-zoom="in" aria-label="放大流程图" disabled>+</button>
        </div>
      </div>
    </section>
    <details id="wf-secondary" class="wf-secondary">
      <summary>运行详情、历史与设置</summary>
      <div class="wf-secondary-body">
        <div class="wf-run-picker">
          <label for="wf-run-select">运行记录</label>
          <select id="wf-run-select" aria-label="查看运行记录" disabled><option>暂无运行记录</option></select><button id="wf-refresh" type="button" disabled>刷新</button><button id="wf-new" type="button" disabled>高级编辑</button>
        </div>
        <div class="wf-run-header"><div><h2 id="wf-run-title">暂无运行记录</h2><div id="wf-run-meta" class="wf-muted"></div></div></div>
        <div class="wf-status-row" aria-live="polite"><span id="wf-change-status" class="wf-badge"></span><span id="wf-progress" class="wf-progress-text"></span></div>
        <details id="wf-execution-settings" class="wf-editor wf-settings-editor">
          <summary>执行设置</summary>
          <p class="wf-muted">默认设置用于新运行；当前主聊天的模型与思考深度未由宿主提供。</p>
          <form id="wf-settings-form" class="wf-settings-form">
            <label for="wf-default-model">默认模型</label>
            <select id="wf-default-model" disabled><option value="">继承 Codex 配置</option></select>
            <label for="wf-default-effort">默认思考深度</label>
            <select id="wf-default-effort" disabled><option value="">继承 Codex 配置</option></select>
            <div class="wf-actions"><button id="wf-save-settings" type="submit" disabled>保存默认设置</button><button id="wf-refresh-settings" type="button" disabled>刷新设置</button></div>
            <div id="wf-settings-error" class="wf-alert" role="alert" hidden></div>
            <div id="wf-settings-status" class="wf-muted" role="status" aria-live="polite"></div>
          </form>
          <section class="wf-node-settings" aria-labelledby="wf-node-settings-title">
            <h3 id="wf-node-settings-title" class="wf-section-title">节点设置</h3>
            <form id="wf-node-settings-form" class="wf-settings-form">
              <label for="wf-node-settings-target">配置节点</label>
              <select id="wf-node-settings-target" disabled><option value="">从流程图选择节点</option></select>
              <label for="wf-node-model">模型</label>
              <select id="wf-node-model" disabled><option value="">继承上级配置</option></select>
              <label for="wf-node-effort">思考深度</label>
              <select id="wf-node-effort" disabled><option value="">继承上级配置</option></select>
              <button id="wf-save-node-settings" type="submit" disabled>使用节点设置</button>
              <div id="wf-node-settings-status" class="wf-muted" role="status" aria-live="polite"></div>
            </form>
          </section>
        </details>
        <details id="wf-editor" class="wf-editor">
          <summary>高级编辑（通常由 Codex 生成计划）</summary>
          <form id="wf-form">
            <div class="wf-actions"><button id="wf-load-template" type="button" disabled>载入所选工作流到新运行</button></div>
            <label for="wf-project-path">项目目录（绝对路径）</label>
            <input id="wf-project-path" name="projectPath" type="text" required autocomplete="off" spellcheck="false" placeholder="从宿主读取不到项目时，请填写目录" disabled>
            <label for="wf-args">输入参数（JSON）</label>
            <textarea id="wf-args" name="args" rows="3" required spellcheck="false" disabled>{}</textarea>
            <label for="wf-script">动态脚本</label>
            <textarea id="wf-script" name="script" rows="12" required spellcheck="false" placeholder="粘贴包含 export const meta 的工作流脚本" disabled></textarea>
            <label class="wf-checkbox"><input id="wf-allow-write" name="allowWrite" type="checkbox" disabled>允许在隔离工作区修改代码和运行测试</label>
            <p class="wf-muted">预览只校验并保存脚本；启动后才执行任务。</p>
            <div id="wf-template-help" class="wf-muted"></div>
            <div class="wf-actions"><button id="wf-save" class="wf-primary" type="submit" disabled>保存预览</button><button id="wf-save-definition" type="button" disabled>保存到工作流库</button><button id="wf-editor-cancel" type="button">收起</button></div>
            <div id="wf-editor-error" class="wf-alert" role="alert" hidden></div>
            <div id="wf-editor-status" class="wf-notice" role="status" hidden></div>
          </form>
        </details>
        <nav class="wf-tabs" role="tablist" aria-label="运行详情">
          <button type="button" id="wf-tab-overview" role="tab" aria-controls="wf-panel-overview" aria-selected="true" data-tab="overview">流程图</button>
          <button type="button" id="wf-tab-tasks" role="tab" aria-controls="wf-panel-tasks" aria-selected="false" data-tab="tasks">任务 <span id="wf-task-count">0</span></button>
          <button type="button" id="wf-tab-diff" role="tab" aria-controls="wf-panel-diff" aria-selected="false" data-tab="diff">差异</button>
          <button type="button" id="wf-tab-logs" role="tab" aria-controls="wf-panel-logs" aria-selected="false" data-tab="logs">日志</button>
        </nav>
        <div class="wf-content">
          <section id="wf-panel-tasks" role="tabpanel" aria-labelledby="wf-tab-tasks" hidden></section>
          <section id="wf-panel-diff" role="tabpanel" aria-labelledby="wf-tab-diff" hidden></section>
          <section id="wf-panel-logs" role="tabpanel" aria-labelledby="wf-tab-logs" hidden></section>
        </div>
      </div>
    </details>
    <footer class="wf-footer"><span>只读任务可并行 · 写入任务上限 1</span><span>按你的请求执行 · 按授权审查与应用</span></footer>
  </section>
</div>
<style>
body{background:var(--color-background-primary,light-dark(#ffffff,#181818))}
#workflow-panel-prototype{padding:12px;color-scheme:inherit;
--wf-bg:var(--color-background-primary,light-dark(#ffffff,#181818));
--wf-surface:var(--color-background-secondary,light-dark(#f5f5f5,#212121));
--wf-selected:var(--color-background-tertiary,light-dark(#ebebeb,#303030));
--wf-text:var(--color-text-primary,light-dark(#202020,#ececec));
--wf-muted:var(--color-text-secondary,light-dark(#686868,#a5a5a5));
--wf-border:var(--color-border-primary,light-dark(#dedede,#383838));
--wf-strong:var(--color-background-inverse,light-dark(#242424,#ececec));
--wf-on-strong:var(--color-text-inverse,light-dark(#ffffff,#181818));
--wf-blue:var(--color-text-info,light-dark(#275cc2,#a8c4ff));
--wf-blue-bg:var(--color-background-info,light-dark(#edf3ff,#26364f));
--wf-green:var(--color-text-success,light-dark(#216140,#a1d6b5));
--wf-green-bg:var(--color-background-success,light-dark(#ecf6ef,#243c2e));
--wf-amber:var(--color-text-warning,light-dark(#80541b,#efc482));
--wf-amber-bg:var(--color-background-warning,light-dark(#fff4df,#413421));
--wf-red:var(--color-text-danger,light-dark(#a23737,#ffb0b0));
--wf-red-bg:var(--color-background-danger,light-dark(#fdeeee,#47292b));
--wf-font:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif);
--wf-mono:var(--font-mono,ui-monospace,SFMono-Regular,Consolas,monospace);
--wf-xs:var(--font-text-xs-size,12px);--wf-sm:var(--font-text-sm-size,14px);--wf-md:var(--font-text-md-size,14px);
--wf-line-xs:var(--font-text-xs-line-height,1.6);--wf-line-sm:var(--font-text-sm-line-height,1.5);--wf-line-md:var(--font-text-md-line-height,1.5);
--wf-title:var(--font-heading-md-size,18px);--wf-heading:var(--font-heading-sm-size,16px);
--wf-title-line:var(--font-heading-md-line-height,1.4);--wf-heading-line:var(--font-heading-sm-line-height,1.5);
--wf-radius-xs:var(--border-radius-xs,4px);--wf-radius-sm:var(--border-radius-sm,6px);--wf-radius-md:var(--border-radius-md,8px);--wf-radius-lg:var(--border-radius-lg,12px);
--wf-weight:var(--font-weight-normal,400);--wf-medium:var(--font-weight-medium,500);--wf-border-width:var(--border-width-regular,1px);
font:var(--wf-weight) var(--wf-sm)/var(--wf-line-sm) var(--wf-font);color:var(--wf-text)}
#workflow-panel-prototype *{box-sizing:border-box}

#workflow-panel-prototype button,#workflow-panel-prototype select,#workflow-panel-prototype input,#workflow-panel-prototype textarea{font:inherit;color:inherit}
#workflow-panel-prototype button{border:var(--wf-border-width) solid var(--wf-border);background:var(--wf-bg);border-radius:var(--wf-radius-md);padding:7px 12px;min-height:34px}

#workflow-panel-prototype .wf-primary{background:var(--wf-strong);color:var(--wf-on-strong);border-color:transparent}

#workflow-panel-prototype .wf-window{background:var(--wf-bg);border:var(--wf-border-width) solid var(--wf-border);border-radius:var(--wf-radius-lg);overflow:clip;min-width:0}
#workflow-panel-prototype .wf-header{padding:18px 20px 12px;border-bottom:var(--wf-border-width) solid var(--wf-border);padding-right:100px}
#workflow-panel-prototype .wf-brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

#workflow-panel-prototype .wf-project{color:var(--wf-muted);margin-top:3px;font-size:var(--wf-xs);line-height:var(--wf-line-xs)}
#workflow-panel-prototype .wf-run-picker{padding:16px 20px 0;display:flex;align-items:center;gap:12px}

#workflow-panel-prototype select{border:var(--wf-border-width) solid var(--wf-border);background:var(--wf-bg);border-radius:var(--wf-radius-md);padding:6px 10px;min-width:0;max-width:100%;flex:1}
#workflow-panel-prototype .wf-run-header{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#workflow-panel-prototype h2{font-size:var(--wf-heading);line-height:var(--wf-heading-line);font-weight:var(--wf-medium);margin:0 0 4px;overflow-wrap:anywhere}

#workflow-panel-prototype .wf-badge{background:var(--wf-surface);color:var(--wf-muted);border-radius:var(--wf-radius-xs);padding:3px 8px;font-size:var(--wf-xs);line-height:var(--wf-line-xs);white-space:nowrap}
#workflow-panel-prototype .wf-badge[data-tone="blue"]{color:var(--wf-blue);background:var(--wf-blue-bg)}

#workflow-panel-prototype .wf-badge[data-tone="amber"]{color:var(--wf-amber);background:var(--wf-amber-bg)}
#workflow-panel-prototype .wf-badge[data-tone="red"]{color:var(--wf-red);background:var(--wf-red-bg)}
#workflow-panel-prototype .wf-progress-text{color:var(--wf-muted);font-size:var(--wf-xs);line-height:var(--wf-line-xs);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

#workflow-panel-prototype .wf-content{padding:20px;min-height:285px}
#workflow-panel-prototype .wf-section-title{margin:0 0 10px;font-weight:var(--wf-medium);font-size:var(--wf-sm);line-height:var(--wf-line-sm)}

@media(max-width:520px){#workflow-panel-prototype{padding:6px}#workflow-panel-prototype .wf-header{padding:14px 14px 12px}#workflow-panel-prototype .wf-run-picker{padding:12px 14px 0;align-items:stretch;flex-direction:column;gap:5px}#workflow-panel-prototype .wf-run-header{padding:15px 14px 10px;align-items:flex-start}#workflow-panel-prototype .wf-status-row{padding:0 14px 12px}#workflow-panel-prototype .wf-tabs{padding:0 8px;gap:0}#workflow-panel-prototype .wf-tabs button{padding:9px 11px}#workflow-panel-prototype .wf-content{padding:15px 14px}#workflow-panel-prototype .wf-phase-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#workflow-panel-prototype .wf-footer{padding:12px 14px}#workflow-panel-prototype .wf-worker{gap:5px}#workflow-panel-prototype .wf-brand{gap:5px}#workflow-panel-prototype .wf-prototype-label{width:100%}}

#workflow-panel-prototype .wf-editor input[type="text"],#workflow-panel-prototype textarea{width:100%;min-width:0;border:var(--wf-border-width) solid var(--wf-border);border-radius:var(--wf-radius-sm);background:var(--wf-bg);padding:9px;resize:vertical}
#workflow-panel-prototype textarea{font:var(--wf-xs)/var(--wf-line-xs) var(--wf-mono)}

#workflow-panel-prototype button:focus-visible,#workflow-panel-prototype select:focus-visible,#workflow-panel-prototype input:focus-visible,#workflow-panel-prototype textarea:focus-visible,#workflow-panel-prototype summary:focus-visible{outline:2px solid var(--wf-blue);outline-offset:2px}
